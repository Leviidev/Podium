name: Podium
options:
  bundleIdPrefix: com.leviidev
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: "NO"
    ENABLE_PREVIEWS: "YES"
    DEVELOPMENT_ASSET_PATHS: ""

targets:
  Podium:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Podium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leviidev.podium
        PRODUCT_NAME: Podium
        DEVELOPMENT_TEAM: H6WR7UCPC9
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Podium
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
      configs:
        Release:
          # The emulator's hot loop touches CPU state through class
          # properties millions of times a second; the dynamic exclusivity
          # checks were about a quarter of its host time.
          SWIFT_ENFORCE_EXCLUSIVITY: unchecked

  PodiumTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PodiumTests
    dependencies:
      - target: Podium
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leviidev.podium.tests
        DEVELOPMENT_TEAM: H6WR7UCPC9
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Podium:
    build:
      targets:
        Podium: all
        PodiumTests: [test]
    test:
      targets:
        - PodiumTests
      commandLineArguments:
        "-PodiumUITesting": false
    run:
      config: Debug
    archive:
      config: Release
